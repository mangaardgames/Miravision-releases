# Udgiv en ny version: filerne sendes til grenen "upload" (installer i dele + update.json).
# Workflowet samler installeren, tjekker størrelse og SHA-256 mod update.json, laver udgivelsen og sletter grenen.
name: Udgiv version
on:
  push:
    branches: [upload]
    paths: [upload/update.json]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upload
      - name: Saml og tjek installeren
        id: check
        run: |
          set -e
          cd upload
          name=$(cat filename.txt)
          cat part-* > "$name"
          python3 - "$name" <<'PY'
          import hashlib, json, sys, pathlib
          f = pathlib.Path(sys.argv[1]); m = json.loads(json.load(open("update.json"))["manifest"])
          data = f.read_bytes()
          assert data[:2] == b"MZ", "ikke et Windows-program"
          assert len(data) == m["size"], f"størrelse {len(data)} != {m['size']}"
          assert hashlib.sha256(data).hexdigest() == m["sha256"], "SHA-256 passer ikke"
          assert m["url"].endswith("/" + f.name), "filnavn passer ikke med update.json"
          print("version", m["version"], "OK")
          open(__import__("os").environ["GITHUB_OUTPUT"], "a").write(f"version={m['version']}\nname={f.name}\n")
          PY
      - name: Lav udgivelsen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd upload
          gh release create "v${{ steps.check.outputs.version }}" "${{ steps.check.outputs.name }}" update.json \
            --target main --title "Mira Vision ${{ steps.check.outputs.version }}" --notes-file notes.md --latest
      - name: Ryd op
        if: always()
        run: git push origin --delete upload || true
